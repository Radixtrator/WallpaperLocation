# ~/.config/wallpaper-location/config.toml
#
# Rules are checked top to bottom; the first match wins.
# A rule can match on any combination of (all given conditions must hold):
#   ssid      = "MyWifi"  or  ["Wifi-A", "Wifi-B"]
#   city / region / country = "Portland" / "Oregon" / "US"   (from IP lookup)
#   lat, lon, radius_km     = GPS-ish circle (radius defaults to 5 km)
# `wallpaper` may be an image file or a folder (a random image from it or its subfolders is picked).
# With a folder, `slideshow = <minutes>` cycles through all of its images instead
# (GNOME cross-fades between them); add `shuffle = false` to go in name order.
# `options` is GNOME's picture-options: zoom, scaled, centered, stretched, spanned, wallpaper.

options = "zoom"

[detection]
geoclue = true     # GNOME Location Services (Settings > Privacy > Location)
ip_lookup = true   # asks ipinfo.io for your public IP's city; set false to stay offline

[[rule]]
name = "home"
ssid = "MyHomeWifi"
wallpaper = "~/Pictures/Wallpapers/home"
slideshow = 30     # new image every 30 minutes

[[rule]]
name = "office"
lat = 45.5231
lon = -122.6765
radius_km = 1.5
wallpaper = "~/Pictures/Wallpapers/office.jpg"

[[rule]]
name = "travelling abroad"
country = ["CA", "MX", "GB"]
wallpaper = "~/Pictures/Wallpapers/travel"

[default]
wallpaper = "/usr/share/backgrounds/gnome"
